<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0f172a"/>
  <!-- Blue ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <!-- Amber dashed ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="60 168"/>
  <!-- Screen outer -->
  <rect x="55" y="55" width="90" height="68" rx="8" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
  <!-- Screen inner -->
  <rect x="62" y="62" width="76" height="54" rx="4" fill="#1e3a5f"/>
  <!-- Bar 1 -->
  <rect x="68" y="95" width="12" height="18" rx="2" fill="#93c5fd"/>
  <!-- Bar 2 -->
  <rect x="84" y="87" width="12" height="26" rx="2" fill="#60a5fa"/>
  <!-- Bar 3 -->
  <rect x="100" y="78" width="12" height="35" rx="2" fill="#3b82f6"/>
  <!-- Amber dot -->
  <circle cx="118" cy="72" r="5" fill="#f59e0b"/>
  <!-- Stand pole -->
  <rect x="91" y="123" width="18" height="10" rx="2" fill="#334155"/>
  <!-- Stand base -->
  <rect x="76" y="133" width="48" height="6" rx="2" fill="#334155"/>
  <!-- Text -->
  <text x="100" y="160" font-family="sans-serif" font-size="11px" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="3">POS COUNTER</text>
</svg>
